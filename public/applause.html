<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applause - Research Documents | Lumen Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔆</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        body {
            background: linear-gradient(135deg, #0c0c0e 0%, #1a1a2e 100%);
            min-height: 100vh;
        }
        .doc-card {
            transition: all 0.3s ease;
            background: rgba(30, 30, 46, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .doc-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            border-color: rgba(99, 102, 241, 0.5);
        }
        .glass {
            background: rgba(30, 30, 46, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body class="text-white">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <!-- Header -->
        <div class="mb-8 animate-fade-in">
            <div class="flex items-center justify-between">
                <div>
                    <div class="flex items-center space-x-3 mb-2">
                        <div class="text-5xl">👏</div>
                        <h1 class="text-5xl font-bold bg-gradient-to-r from-white to-zinc-400 bg-clip-text text-transparent">
                            Applause
                        </h1>
                    </div>
                    <p class="text-zinc-400 text-lg ml-16">Customer research & testimonials</p>
                </div>
                <a href="https://lumen-dashboard.onrender.com" 
                   class="px-6 py-3 glass rounded-xl hover:bg-indigo-600/20 transition flex items-center space-x-2">
                    <span>← Dashboard</span>
                </a>
            </div>
        </div>

        <!-- Stats bar -->
        <div id="stats-bar" class="mb-8 glass rounded-2xl p-6 animate-fade-in hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="text-center">
                    <div class="text-3xl font-bold text-indigo-400" id="total-count">-</div>
                    <div class="text-sm text-zinc-400 mt-1">Total Documents</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold text-yellow-400" id="starred-count">-</div>
                    <div class="text-sm text-zinc-400 mt-1">Starred</div>
                </div>
                <div class="text-center">
                    <div class="text-3xl font-bold text-green-400" id="size-total">-</div>
                    <div class="text-sm text-zinc-400 mt-1">Total Size</div>
                </div>
            </div>
        </div>

        <!-- Filter tabs -->
        <div class="mb-8 flex space-x-3 animate-fade-in">
            <button class="filter-btn px-6 py-3 rounded-xl bg-indigo-600 text-white font-medium shadow-lg" data-filter="all">
                All Documents
            </button>
            <button class="filter-btn px-6 py-3 rounded-xl glass text-zinc-300 hover:bg-indigo-600/20 font-medium transition" data-filter="starred">
                ⭐ Starred
            </button>
        </div>

        <!-- Loading state -->
        <div id="loading" class="text-center py-16">
            <div class="inline-block animate-spin rounded-full h-16 w-16 border-b-4 border-indigo-600"></div>
            <p class="mt-6 text-zinc-400 text-lg">Loading documents...</p>
        </div>

        <!-- Documents grid -->
        <div id="documents-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden animate-fade-in">
            <!-- Documents will be inserted here -->
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="text-center py-16 hidden">
            <div class="text-8xl mb-6 opacity-50">📄</div>
            <p class="text-zinc-400 text-xl">No documents found</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="max-w-7xl mx-auto px-4 py-8 text-center text-zinc-500 text-sm">
        <p>Powered by Lumen AI • Built with 💎</p>
    </div>

    <script>
        let allDocuments = [];
        let currentFilter = 'all';

        // Load documents
        async function loadDocuments() {
            try {
                const response = await fetch('/api/documents?section=Applause&archived=false');
                const data = await response.json();
                
                allDocuments = data.documents || [];
                updateStats();
                renderDocuments();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('stats-bar').classList.remove('hidden');
                
            } catch (error) {
                console.error('Error loading documents:', error);
                document.getElementById('loading').innerHTML = `
                    <p class="text-red-400 text-lg">Failed to load documents</p>
                    <p class="text-zinc-500 mt-2">${error.message}</p>
                `;
            }
        }

        // Update stats
        function updateStats() {
            const starred = allDocuments.filter(d => d.starred).length;
            const totalSize = allDocuments.reduce((sum, d) => sum + (d.file_size || 0), 0);
            const sizeMB = (totalSize / 1024 / 1024).toFixed(1);
            
            document.getElementById('total-count').textContent = allDocuments.length;
            document.getElementById('starred-count').textContent = starred;
            document.getElementById('size-total').textContent = sizeMB + ' MB';
        }

        // Render documents
        function renderDocuments() {
            const grid = document.getElementById('documents-grid');
            const emptyState = document.getElementById('empty-state');
            
            let filteredDocs = allDocuments;
            if (currentFilter === 'starred') {
                filteredDocs = allDocuments.filter(doc => doc.starred);
            }
            
            if (filteredDocs.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }
            
            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            
            grid.innerHTML = filteredDocs.map(doc => {
                const uploadedDate = new Date(doc.uploaded_at).toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });
                
                const fileIcon = getFileIcon(doc.mime_type);
                const fileSizeKB = Math.round(doc.file_size / 1024);
                
                return `
                    <div class="doc-card rounded-2xl overflow-hidden">
                        <div class="p-6">
                            <div class="flex items-start justify-between mb-4">
                                <div class="text-5xl">${fileIcon}</div>
                                <button class="star-btn text-3xl transition-transform hover:scale-110" data-id="${doc.id}" data-starred="${doc.starred}">
                                    ${doc.starred ? '⭐' : '☆'}
                                </button>
                            </div>
                            
                            <h3 class="text-xl font-semibold text-white mb-3 line-clamp-2">
                                ${escapeHtml(doc.title)}
                            </h3>
                            
                            ${doc.description ? `
                                <p class="text-sm text-zinc-400 mb-4 line-clamp-2">
                                    ${escapeHtml(doc.description)}
                                </p>
                            ` : ''}
                            
                            ${doc.tags && doc.tags.length > 0 ? `
                                <div class="flex flex-wrap gap-2 mb-4">
                                    ${doc.tags.slice(0, 3).map(tag => `
                                        <span class="px-3 py-1 bg-indigo-600/20 text-indigo-300 text-xs rounded-full border border-indigo-500/30">
                                            ${escapeHtml(tag)}
                                        </span>
                                    `).join('')}
                                    ${doc.tags.length > 3 ? `<span class="text-xs text-zinc-500">+${doc.tags.length - 3}</span>` : ''}
                                </div>
                            ` : ''}
                            
                            <div class="flex items-center justify-between text-xs text-zinc-500 mb-5">
                                <span>${fileSizeKB} KB</span>
                                <span>${uploadedDate}</span>
                            </div>
                            
                            <div class="flex space-x-3">
                                <a href="/api/documents/${doc.id}/download" 
                                   class="flex-1 px-4 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition text-center text-sm font-medium">
                                    📥 Download
                                </a>
                                <button class="archive-btn px-4 py-3 glass hover:bg-red-600/20 text-zinc-300 rounded-xl transition text-sm"
                                        data-id="${doc.id}">
                                    🗄️
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            
            // Attach event listeners
            attachEventListeners();
        }

        // Get file icon based on MIME type
        function getFileIcon(mimeType) {
            if (mimeType.includes('pdf')) return '📄';
            if (mimeType.includes('image')) return '🖼️';
            if (mimeType.includes('word') || mimeType.includes('document')) return '📝';
            if (mimeType.includes('excel') || mimeType.includes('spreadsheet')) return '📊';
            if (mimeType.includes('text')) return '📃';
            return '📎';
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Attach event listeners to buttons
        function attachEventListeners() {
            // Star buttons
            document.querySelectorAll('.star-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.dataset.id;
                    try {
                        const response = await fetch(`/api/documents/${id}/star`, {
                            method: 'PATCH'
                        });
                        const data = await response.json();
                        
                        // Update local state
                        const doc = allDocuments.find(d => d.id == id);
                        if (doc) {
                            doc.starred = data.document.starred;
                        }
                        
                        updateStats();
                        renderDocuments();
                    } catch (error) {
                        console.error('Error starring document:', error);
                    }
                });
            });
            
            // Archive buttons
            document.querySelectorAll('.archive-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if (!confirm('Archive this document?')) return;
                    
                    const id = e.target.dataset.id;
                    try {
                        await fetch(`/api/documents/${id}/archive`, {
                            method: 'PATCH'
                        });
                        
                        // Remove from local state
                        allDocuments = allDocuments.filter(d => d.id != id);
                        updateStats();
                        renderDocuments();
                    } catch (error) {
                        console.error('Error archiving document:', error);
                    }
                });
            });
        }

        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-indigo-600', 'text-white', 'shadow-lg');
                    b.classList.add('glass', 'text-zinc-300');
                });
                
                e.target.classList.remove('glass', 'text-zinc-300');
                e.target.classList.add('bg-indigo-600', 'text-white', 'shadow-lg');
                
                currentFilter = e.target.dataset.filter;
                renderDocuments();
            });
        });

        // Load on page load
        loadDocuments();
    </script>
</body>
</html>
