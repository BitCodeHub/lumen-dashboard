<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Disabled - Lumen Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { background: #0c0c0e; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.5s ease-out; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md animate-fade-in">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="text-6xl mb-3">🔆</div>
      <h1 class="text-3xl font-bold text-white mb-2">Registration Closed</h1>
      <p class="text-zinc-400">New account sign-ups are currently disabled</p>
    </div>

    <!-- Message Box -->
    <div class="bg-zinc-900 rounded-2xl p-8 shadow-xl border border-zinc-800 text-center">
      <div class="text-5xl mb-4">🔒</div>
      <h2 class="text-xl font-semibold text-white mb-3">Invite Only</h2>
      <p class="text-zinc-400 mb-6">
        Lumen Dashboard is currently in private beta. 
        Contact the admin if you need access.
      </p>
      
      <!-- Login link -->
      <a 
        href="/login.html" 
        class="inline-block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg transition duration-200"
      >
        Already have an account? Sign In
      </a>
      
      <!-- Public pages -->
      <div class="mt-6 pt-6 border-t border-zinc-800">
        <p class="text-zinc-500 text-sm mb-3">Public pages:</p>
        <a href="/company-structure.html" class="text-indigo-400 hover:text-indigo-300 text-sm">
          View Company Structure →
        </a>
      </div>
    </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-zinc-500 text-sm">
      <p>🔆 Lumen AI Solutions</p>
    </div>
  </div>
</body>
</html>
