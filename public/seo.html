<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Reports Dashboard - Lumen AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { 
            background: #0A0A0F;
            color: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            position: relative;
        }
        .score-excellent { background: linear-gradient(135deg, #10B981 0%, #059669 100%); }
        .score-good { background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%); }
        .score-fair { background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%); }
        .score-poor { background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%); }
        
        .stat-card {
            background: linear-gradient(135deg, #1A1A2E 0%, #16213E 100%);
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .report-card {
            background: #111113;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #27272a;
            transition: all 0.3s ease;
        }
        
        .report-card:hover {
            border-color: #6366f1;
            transform: translateY(-2px);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn-primary:hover {
            transform: scale(1.05);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: #111113;
            border-radius: 16px;
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .tab {
            padding: 0.75rem 1.5rem;
            background: #18181b;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: #6366f1;
        }
    </style>
</head>
<body class="p-8">
    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
        <div>
            <h1 class="text-4xl font-bold mb-2">🔍 SEO Reports Dashboard</h1>
            <p class="text-gray-400">Track and improve website SEO performance over time</p>
        </div>
        <button onclick="showUploadModal()" class="btn-primary">
            + Upload New Report
        </button>
    </div>

    <!-- Stats Overview -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8" id="statsOverview">
        <div class="stat-card">
            <div class="text-gray-400 text-sm mb-2">Total Reports</div>
            <div class="text-3xl font-bold" id="totalReports">-</div>
        </div>
        <div class="stat-card">
            <div class="text-gray-400 text-sm mb-2">Websites Tracked</div>
            <div class="text-3xl font-bold" id="websitesTracked">-</div>
        </div>
        <div class="stat-card">
            <div class="text-gray-400 text-sm mb-2">Avg Score</div>
            <div class="text-3xl font-bold" id="avgScore">-</div>
        </div>
        <div class="stat-card">
            <div class="text-gray-400 text-sm mb-2">Next Audit</div>
            <div class="text-3xl font-bold" id="nextAudit">-</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="flex gap-4 mb-6">
        <div class="tab active" onclick="switchTab('all')">All Reports</div>
        <div class="tab" onclick="switchTab('trends')">Score Trends</div>
        <div class="tab" onclick="switchTab('scheduled')">Scheduled</div>
    </div>

    <!-- All Reports View -->
    <div id="allReportsView" class="space-y-4">
        <!-- Reports will be loaded here -->
    </div>

    <!-- Trends View -->
    <div id="trendsView" style="display: none;">
        <div class="bg-[#111113] rounded-xl p-6">
            <h2 class="text-2xl font-bold mb-4">Score Trends Over Time</h2>
            <div class="mb-4">
                <select id="websiteSelect" onchange="loadTrends()" class="bg-[#18181b] text-white px-4 py-2 rounded-lg border border-gray-700">
                    <option value="">Select a website...</option>
                </select>
            </div>
            <canvas id="trendsChart" style="max-height: 400px;"></canvas>
        </div>
    </div>

    <!-- Scheduled View -->
    <div id="scheduledView" style="display: none;" class="space-y-4">
        <!-- Scheduled audits will be loaded here -->
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold">Upload SEO Report</h2>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
            </div>
            
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="space-y-4">
                    <!-- Website Info -->
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Website URL *</label>
                        <input type="url" name="website_url" required 
                            class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white"
                            placeholder="https://example.com">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Website Name *</label>
                        <input type="text" name="website_name" required
                            class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white"
                            placeholder="Example Website">
                    </div>
                    
                    <!-- Scores -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Overall Score * (0-100)</label>
                            <input type="number" name="overall_score" required min="0" max="100"
                                class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Technical Score (0-100)</label>
                            <input type="number" name="technical_score" min="0" max="100"
                                class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">On-Page Score (0-100)</label>
                            <input type="number" name="onpage_score" min="0" max="100"
                                class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Content Score (0-100)</label>
                            <input type="number" name="content_score" min="0" max="100"
                                class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">UX Score (0-100)</label>
                            <input type="number" name="ux_score" min="0" max="100"
                                class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Mobile Score (0-100)</label>
                            <input type="number" name="mobile_score" min="0" max="100"
                                class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                        </div>
                    </div>
                    
                    <!-- Issues -->
                    <div class="grid grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Critical Issues</label>
                            <input type="number" name="critical_issues" min="0"
                                class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Warnings</label>
                            <input type="number" name="warnings" min="0"
                                class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                        </div>
                        <div>
                            <label class="block text-sm text-gray-400 mb-2">Recommendations</label>
                            <input type="number" name="recommendations" min="0"
                                class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                        </div>
                    </div>
                    
                    <!-- Files -->
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">PDF Report</label>
                        <input type="file" name="pdf" accept=".pdf"
                            class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">HTML Report</label>
                        <input type="file" name="html" accept=".html"
                            class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Markdown Report</label>
                        <input type="file" name="markdown" accept=".md"
                            class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                    </div>
                    
                    <!-- Dates -->
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Audit Date</label>
                        <input type="datetime-local" name="audit_date"
                            class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Next Audit Date</label>
                        <input type="datetime-local" name="next_audit_date"
                            class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white">
                    </div>
                    
                    <!-- Notes -->
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Notes</label>
                        <textarea name="notes" rows="3"
                            class="w-full bg-[#18181b] border border-gray-700 rounded-lg px-4 py-2 text-white"
                            placeholder="Any additional notes..."></textarea>
                    </div>
                </div>
                
                <div class="flex gap-4 mt-6">
                    <button type="submit" class="btn-primary flex-1">Upload Report</button>
                    <button type="button" onclick="closeUploadModal()" 
                        class="px-6 py-3 bg-gray-700 text-white rounded-lg hover:bg-gray-600">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentTab = 'all';
        let trendsChart = null;

        // Load reports on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadReports();
            loadStats();
        });

        async function loadReports() {
            try {
                const res = await fetch('/api/seo-reports');
                const data = await res.json();
                
                renderReports(data.reports);
                populateWebsiteSelect(data.reports);
            } catch (error) {
                console.error('Error loading reports:', error);
            }
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/seo-reports');
                const data = await res.json();
                
                const reports = data.reports;
                const websites = new Set(reports.map(r => r.website_url)).size;
                const avgScore = reports.length > 0 
                    ? Math.round(reports.reduce((sum, r) => sum + r.overall_score, 0) / reports.length)
                    : 0;
                
                // Find next audit
                const upcoming = reports
                    .filter(r => r.next_audit_date && new Date(r.next_audit_date) > new Date())
                    .sort((a, b) => new Date(a.next_audit_date) - new Date(b.next_audit_date));
                
                const nextAudit = upcoming.length > 0 
                    ? new Date(upcoming[0].next_audit_date).toLocaleDateString()
                    : 'None';
                
                document.getElementById('totalReports').textContent = reports.length;
                document.getElementById('websitesTracked').textContent = websites;
                document.getElementById('avgScore').textContent = avgScore;
                document.getElementById('nextAudit').textContent = nextAudit;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        function renderReports(reports) {
            const container = document.getElementById('allReportsView');
            
            if (reports.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 py-12">No reports yet. Upload your first report!</div>';
                return;
            }
            
            container.innerHTML = reports.map(report => {
                const scoreClass = getScoreClass(report.overall_score);
                const scoreLabel = getScoreLabel(report.overall_score);
                const date = new Date(report.audit_date).toLocaleDateString();
                
                return `
                    <div class="report-card">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <h3 class="text-xl font-bold mb-2">${report.website_name}</h3>
                                <div class="text-sm text-gray-400 mb-4">${report.website_url}</div>
                                
                                <div class="flex items-center gap-6 mb-4">
                                    <div class="score-circle ${scoreClass}">
                                        ${report.overall_score}
                                    </div>
                                    <div class="flex-1 space-y-2">
                                        ${report.technical_score ? `<div class="flex items-center justify-between">
                                            <span class="text-sm text-gray-400">Technical</span>
                                            <span class="font-bold">${report.technical_score}/100</span>
                                        </div>` : ''}
                                        ${report.onpage_score ? `<div class="flex items-center justify-between">
                                            <span class="text-sm text-gray-400">On-Page</span>
                                            <span class="font-bold">${report.onpage_score}/100</span>
                                        </div>` : ''}
                                        ${report.content_score ? `<div class="flex items-center justify-between">
                                            <span class="text-sm text-gray-400">Content</span>
                                            <span class="font-bold">${report.content_score}/100</span>
                                        </div>` : ''}
                                    </div>
                                    <div class="flex-1 space-y-2">
                                        ${report.ux_score ? `<div class="flex items-center justify-between">
                                            <span class="text-sm text-gray-400">UX</span>
                                            <span class="font-bold">${report.ux_score}/100</span>
                                        </div>` : ''}
                                        ${report.mobile_score ? `<div class="flex items-center justify-between">
                                            <span class="text-sm text-gray-400">Mobile</span>
                                            <span class="font-bold">${report.mobile_score}/100</span>
                                        </div>` : ''}
                                    </div>
                                </div>
                                
                                <div class="flex items-center gap-6 text-sm">
                                    ${report.critical_issues > 0 ? `<span class="text-red-400">🔴 ${report.critical_issues} Critical</span>` : ''}
                                    ${report.warnings > 0 ? `<span class="text-yellow-400">⚠️ ${report.warnings} Warnings</span>` : ''}
                                    ${report.recommendations > 0 ? `<span class="text-blue-400">💡 ${report.recommendations} Recommendations</span>` : ''}
                                </div>
                            </div>
                            
                            <div class="text-right space-y-2">
                                <div class="text-sm text-gray-400">Audited: ${date}</div>
                                ${report.next_audit_date ? `<div class="text-sm text-gray-400">Next: ${new Date(report.next_audit_date).toLocaleDateString()}</div>` : ''}
                                <div class="flex gap-2 mt-4">
                                    ${report.pdf_path ? `<button onclick="downloadReport(${report.id}, 'pdf')" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">PDF</button>` : ''}
                                    ${report.html_path ? `<button onclick="downloadReport(${report.id}, 'html')" class="px-4 py-2 bg-green-600 text-white rounded-lg text-sm hover:bg-green-700">HTML</button>` : ''}
                                    ${report.markdown_path ? `<button onclick="downloadReport(${report.id}, 'markdown')" class="px-4 py-2 bg-purple-600 text-white rounded-lg text-sm hover:bg-purple-700">MD</button>` : ''}
                                    <button onclick="deleteReport(${report.id})" class="px-4 py-2 bg-red-600 text-white rounded-lg text-sm hover:bg-red-700">Delete</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getScoreClass(score) {
            if (score >= 80) return 'score-excellent';
            if (score >= 60) return 'score-good';
            if (score >= 40) return 'score-fair';
            return 'score-poor';
        }

        function getScoreLabel(score) {
            if (score >= 80) return 'Excellent';
            if (score >= 60) return 'Good';
            if (score >= 40) return 'Fair';
            return 'Poor';
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update tab styles
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            // Show/hide views
            document.getElementById('allReportsView').style.display = tab === 'all' ? 'block' : 'none';
            document.getElementById('trendsView').style.display = tab === 'trends' ? 'block' : 'none';
            document.getElementById('scheduledView').style.display = tab === 'scheduled' ? 'block' : 'none';
            
            if (tab === 'scheduled') {
                loadScheduled();
            }
        }

        function populateWebsiteSelect(reports) {
            const select = document.getElementById('websiteSelect');
            const websites = [...new Set(reports.map(r => r.website_url))];
            
            select.innerHTML = '<option value="">Select a website...</option>' +
                websites.map(url => `<option value="${url}">${url}</option>`).join('');
        }

        async function loadTrends() {
            const website = document.getElementById('websiteSelect').value;
            if (!website) return;
            
            try {
                const res = await fetch(`/api/seo-reports/trends/${encodeURIComponent(website)}`);
                const data = await res.json();
                
                renderTrendsChart(data.trends);
            } catch (error) {
                console.error('Error loading trends:', error);
            }
        }

        function renderTrendsChart(trends) {
            const ctx = document.getElementById('trendsChart');
            
            if (trendsChart) {
                trendsChart.destroy();
            }
            
            trendsChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trends.map(t => new Date(t.audit_date).toLocaleDateString()),
                    datasets: [
                        {
                            label: 'Overall',
                            data: trends.map(t => t.overall_score),
                            borderColor: '#6366f1',
                            backgroundColor: 'rgba(99, 102, 241, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Technical',
                            data: trends.map(t => t.technical_score),
                            borderColor: '#EF4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Content',
                            data: trends.map(t => t.content_score),
                            borderColor: '#10B981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'UX',
                            data: trends.map(t => t.ux_score),
                            borderColor: '#F59E0B',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: { color: '#fff' }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100,
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        x: {
                            ticks: { color: '#fff' },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        }
                    }
                }
            });
        }

        async function loadScheduled() {
            try {
                const res = await fetch('/api/seo-reports?status=scheduled');
                const data = await res.json();
                
                const container = document.getElementById('scheduledView');
                
                if (data.reports.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-400 py-12">No scheduled audits</div>';
                    return;
                }
                
                container.innerHTML = data.reports.map(report => `
                    <div class="report-card">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-xl font-bold">${report.website_name}</h3>
                                <div class="text-sm text-gray-400">${report.website_url}</div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm text-gray-400">Scheduled for</div>
                                <div class="text-lg font-bold">${new Date(report.next_audit_date).toLocaleDateString()}</div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading scheduled:', error);
            }
        }

        function showUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.getElementById('uploadForm').reset();
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            
            try {
                const res = await fetch('/api/seo-reports', {
                    method: 'POST',
                    body: formData
                });
                
                if (res.ok) {
                    closeUploadModal();
                    loadReports();
                    loadStats();
                    alert('Report uploaded successfully!');
                } else {
                    const error = await res.json();
                    alert('Error: ' + error.error);
                }
            } catch (error) {
                console.error('Error uploading report:', error);
                alert('Error uploading report');
            }
        });

        async function downloadReport(id, type) {
            window.location.href = `/api/seo-reports/${id}/download/${type}`;
        }

        async function deleteReport(id) {
            if (!confirm('Are you sure you want to delete this report?')) return;
            
            try {
                const res = await fetch(`/api/seo-reports/${id}`, {
                    method: 'DELETE'
                });
                
                if (res.ok) {
                    loadReports();
                    loadStats();
                } else {
                    alert('Error deleting report');
                }
            } catch (error) {
                console.error('Error deleting report:', error);
            }
        }
    </script>
</body>
</html>
