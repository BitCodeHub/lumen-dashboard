<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumen · Intelligence Dashboard</title>
  <meta name="description" content="Intelligence briefings and research dashboard">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔆</text></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔆</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 800: '#18181b', 850: '#141416', 900: '#0c0c0e', 950: '#09090b' },
            accent: { DEFAULT: '#6366f1', hover: '#818cf8', muted: 'rgba(99, 102, 241, 0.15)' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #0c0c0e; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInRight { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
    @keyframes slideInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes countUp { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes progressFill { from { width: 0%; } }
    @keyframes bounce-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes glow { 0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.3); } 50% { box-shadow: 0 0 30px rgba(99, 102, 241, 0.5); } }
    
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    .animate-slide-in { animation: slideIn 0.2s ease-out; }
    .animate-slide-in-right { animation: slideInRight 0.25s ease-out; }
    .animate-slide-in-left { animation: slideInLeft 0.25s ease-out; }
    .animate-slide-in-up { animation: slideInUp 0.3s ease-out; }
    .animate-pulse-subtle { animation: pulse-subtle 2s ease-in-out infinite; }
    .animate-count-up { animation: countUp 0.4s ease-out; }
    .animate-bounce-soft { animation: bounce-soft 2s ease-in-out infinite; }
    .animate-glow { animation: glow 2s ease-in-out infinite; }
    .skeleton { background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    
    .prose { line-height: 1.7; }
    .prose p { margin-bottom: 1rem; }
    .prose strong { color: #f4f4f5; font-weight: 600; }
    .prose a { color: #818cf8; }
    .prose a:hover { text-decoration: underline; }
    
    .nav-item { transition: all 0.15s ease; }
    .briefing-card { transition: all 0.15s ease; }
    .briefing-card:hover { background: rgba(39, 39, 42, 0.5); }
    .nav-item.active { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: #6366f1; border-radius: 0 2px 2px 0; }
    
    .badge { font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.025em; text-transform: uppercase; }
    .tag { font-size: 0.625rem; padding: 2px 6px; border-radius: 4px; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
    
    .modal-backdrop { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }
    .modal { background: #18181b; border: 1px solid #27272a; }
    
    .kbd { font-size: 0.625rem; padding: 2px 5px; background: #27272a; border: 1px solid #3f3f46; border-radius: 4px; font-family: monospace; }
    
    .chart-bar { transition: height 0.3s ease; }
    
    .search-highlight { background: rgba(99, 102, 241, 0.3); padding: 1px 2px; border-radius: 2px; }
    
    /* Expense-specific styles */
    .expense-card { transition: all 0.2s ease; }
    .expense-card:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3); }
    .expense-card:active { transform: scale(0.98); }
    
    .category-icon { transition: all 0.2s ease; }
    .category-icon:hover { transform: scale(1.1); }
    
    .progress-bar { transition: width 0.5s ease-out; animation: progressFill 0.8s ease-out; }
    
    .donut-segment { transition: all 0.3s ease; transform-origin: center; }
    .donut-segment:hover { transform: scale(1.05); filter: brightness(1.2); }
    
    .expense-item { transition: all 0.2s ease; }
    .expense-item:hover { background: rgba(39, 39, 42, 0.5); }
    .expense-item:active { background: rgba(39, 39, 42, 0.7); }
    
    .trend-bar { transition: all 0.3s ease; }
    .trend-bar:hover { filter: brightness(1.2); }
    
    /* Mobile sidebar overlay */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 40;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
    }
    .sidebar-overlay.active { opacity: 1; visibility: visible; }
    
    /* Mobile sidebar */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        width: 280px;
      }
      .sidebar.open { transform: translateX(0); }
      
      .briefing-list-panel {
        position: absolute;
        inset: 0;
        z-index: 10;
        width: 100% !important;
        border-right: none !important;
      }
      
      .briefing-detail-panel {
        position: absolute;
        inset: 0;
        z-index: 20;
        transform: translateX(100%);
        transition: transform 0.25s ease;
      }
      .briefing-detail-panel.active { transform: translateX(0); }
    }
    
    /* Tablet */
    @media (min-width: 769px) and (max-width: 1024px) {
      .sidebar { width: 220px !important; }
      .briefing-list-panel { width: 260px !important; }
    }
    
    /* Safe area for notched phones */
    @supports (padding: max(0px)) {
      .safe-top { padding-top: max(0.5rem, env(safe-area-inset-top)); }
      .safe-bottom { padding-bottom: max(0.5rem, env(safe-area-inset-bottom)); }
    }

    /* Floating action button */
    .fab {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      z-index: 30;
    }
    .fab:hover { transform: scale(1.05); box-shadow: 0 12px 40px rgba(99, 102, 241, 0.5); }
    .fab:active { transform: scale(0.95); }
    
    @media (max-width: 768px) {
      .fab { bottom: 20px; right: 20px; width: 52px; height: 52px; }
    }
  </style>
</head>

  <script>
    // ============================================
    // STATE
    // ============================================
    let currentView = 'briefings';
    let currentFilter = null;
    let starredFilter = false;
    let archivedFilter = false;
    let tagFilter = null;
    let searchQuery = '';
    let briefings = [];
    let selectedId = null;
    let selectedIndex = -1;
    let isMobile = window.innerWidth < 768;
    
    // Expense state
    let expenses = [];
    let expenseSummary = {};
    let selectedMonth = new Date().toISOString().slice(0, 7);
    let selectedExpenseCategory = 'Food';

    // Category configuration
    const categoryConfig = {
      'Food': { icon: '🍔', color: 'bg-orange-500', bgColor: 'bg-orange-500/20', textColor: 'text-orange-400', borderColor: 'border-orange-500/30' },
      'Transport': { icon: '🚗', color: 'bg-blue-500', bgColor: 'bg-blue-500/20', textColor: 'text-blue-400', borderColor: 'border-blue-500/30' },
      'Shopping': { icon: '🛍️', color: 'bg-pink-500', bgColor: 'bg-pink-500/20', textColor: 'text-pink-400', borderColor: 'border-pink-500/30' },
      'Entertainment': { icon: '🎬', color: 'bg-purple-500', bgColor: 'bg-purple-500/20', textColor: 'text-purple-400', borderColor: 'border-purple-500/30' },
      'Bills': { icon: '📄', color: 'bg-red-500', bgColor: 'bg-red-500/20', textColor: 'text-red-400', borderColor: 'border-red-500/30' },
      'Health': { icon: '💊', color: 'bg-green-500', bgColor: 'bg-green-500/20', textColor: 'text-green-400', borderColor: 'border-green-500/30' },
      'Gas': { icon: '⛽', color: 'bg-yellow-500', bgColor: 'bg-yellow-500/20', textColor: 'text-yellow-400', borderColor: 'border-yellow-500/30' },
      'Groceries': { icon: '🛒', color: 'bg-teal-500', bgColor: 'bg-teal-500/20', textColor: 'text-teal-400', borderColor: 'border-teal-500/30' },
      'Other': { icon: '📦', color: 'bg-zinc-500', bgColor: 'bg-zinc-500/20', textColor: 'text-zinc-400', borderColor: 'border-zinc-500/30' }
    };

    const typeConfig = {
      'morning-briefing': { label: 'Morning', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' },
      'ai-opportunities': { label: 'AI Opportunity', color: 'bg-violet-500/20 text-violet-400 border-violet-500/30' },
      'traffic': { label: 'Traffic', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' },
      'email': { label: 'Email', color: 'bg-blue-500/20 text-blue-400 border-blue-500/30' },
      'evening-wrap': { label: 'Evening', color: 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' },
      'ai-radar': { label: 'AI Radar', color: 'bg-pink-500/20 text-pink-400 border-pink-500/30' }
    };

    // ============================================
    // VIEW SWITCHING
    // ============================================
    function switchView(view) {
      currentView = view;
      const briefingsView = document.getElementById('briefings-view');
      const expensesView = document.getElementById('expenses-view');
      
      if (view === 'expenses') {
        briefingsView.classList.add('hidden');
        expensesView.classList.remove('hidden');
        document.getElementById('current-filter').textContent = 'Expenses';
        document.getElementById('briefing-count').textContent = '';
        updateActiveFilter('expenses');
        loadExpenses();
      } else {
        briefingsView.classList.remove('hidden');
        expensesView.classList.add('hidden');
      }
    }

    // ============================================
    // MOBILE FUNCTIONS
    // ============================================
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }
    
    function closeSidebarOnMobile() {
      if (isMobile) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('active');
      }
    }
    
    function showDetailPanel() {
      if (isMobile) {
        document.getElementById('briefing-detail').classList.add('active');
      }
    }
    
    function hideDetailPanel() {
      if (isMobile) {
        document.getElementById('briefing-detail').classList.remove('active');
      }
    }

    window.addEventListener('resize', () => {
      isMobile = window.innerWidth < 768;
      if (!isMobile) {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('sidebar-overlay').classList.remove('active');
        document.getElementById('briefing-detail').classList.remove('active');
      }
    });

    // ============================================
    // EXPENSES API & RENDERING
    // ============================================
    async function loadExpenses() {
      try {
        const [expensesRes, summaryRes] = await Promise.all([
          fetch(`/api/expenses?month=${selectedMonth}`),
          fetch(`/api/expenses/summary?month=${selectedMonth}`)
        ]);
        
        expenses = await expensesRes.json();
        expenseSummary = await summaryRes.json();
        
        renderExpensesView();
      } catch (err) {
        console.error('Error loading expenses:', err);
      }
    }

    function renderExpensesView() {
      const container = document.getElementById('expenses-content');
      const budget = 3000; // Default monthly budget
      const spent = expenseSummary.total || 0;
      const remaining = budget - spent;
      const progress = Math.min((spent / budget) * 100, 100);
      const isOverBudget = spent > budget;
      
      // Calculate daily spending for trend chart
      const dailySpending = {};
      const today = new Date();
      for (let i = 6; i >= 0; i--) {
        const date = new Date(today);
        date.setDate(date.getDate() - i);
        const key = date.toISOString().slice(0, 10);
        dailySpending[key] = 0;
      }
      expenses.forEach(e => {
        const date = e.created_at.slice(0, 10);
        if (dailySpending[date] !== undefined) {
          dailySpending[date] += e.amount;
        }
      });
      const maxDaily = Math.max(...Object.values(dailySpending), 1);
      
      // Category breakdown
      const categoryTotals = expenseSummary.byCategory || {};
      const sortedCategories = Object.entries(categoryTotals).sort((a, b) => b[1] - a[1]);
      
      container.innerHTML = `
        <div class="animate-fade-in space-y-6">
          <!-- Month Selector & Header -->
          <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <h2 class="text-2xl font-bold text-zinc-100">Expense Tracker</h2>
              <p class="text-sm text-zinc-500 mt-1">Track your spending habits</p>
            </div>

    function renderDonutChart(categories, total) {
      if (categories.length === 0) return '';
      
      const colors = {
        'Food': '#f97316',
        'Transport': '#3b82f6',
        'Shopping': '#ec4899',
        'Entertainment': '#a855f7',
        'Bills': '#ef4444',
        'Health': '#22c55e',
        'Gas': '#eab308',
        'Groceries': '#14b8a6',
        'Other': '#71717a'
      };
      
      let offset = 0;
      const radius = 15.915;
      const circumference = 2 * Math.PI * radius;
      
      return categories.map(([cat, amount]) => {
        const pct = total > 0 ? (amount / total) * 100 : 0;
        const dashLength = (pct / 100) * circumference;
        const color = colors[cat] || colors['Other'];
        const segment = `
          <circle
            class="donut-segment"
            cx="18" cy="18" r="${radius}"
            fill="none"
            stroke="${color}"
            stroke-width="3"
            stroke-dasharray="${dashLength} ${circumference - dashLength}"
            stroke-dashoffset="${-offset}"
            stroke-linecap="round"
          />
        `;
        offset += dashLength;
        return segment;
      }).join('');
    }

    function formatMonthYear(monthStr) {
      const [year, month] = monthStr.split('-');
      const date = new Date(year, parseInt(month) - 1);
      return date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    }

    function changeMonth(delta) {
      const [year, month] = selectedMonth.split('-').map(Number);

      loadExpenses();

    async function submitExpense() {
      const amount = parseFloat(document.getElementById('expense-amount').value);
      const description = document.getElementById('expense-description').value.trim();
      
      if (!amount || amount <= 0) {
        alert('Please enter a valid amount');
        return;
      }
      
      try {
        const res = await fetch('/api/expenses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            amount,
            category: selectedExpenseCategory,
            description: description || null
          })
        });
        
        if (res.ok) {
          closeModal();
          loadExpenses();
        } else {
          const err = await res.json();
          alert(err.error || 'Failed to add expense');
        }
      } catch (err) {
        console.error('Error adding expense:', err);
        alert('Failed to add expense');
      }
    }

      try {
        await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
        loadExpenses();
      } catch (err) {
        console.error('Error deleting expense:', err);
      }
    }

    // ============================================
    // UTILITIES
    // ============================================
    function formatContent(content) {
      return escapeHtml(content)
        .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener" class="text-indigo-400 hover:text-indigo-300 break-all">$1</a>')
        .replace(/\*\*(.+?)\*\*/g, '<strong class="text-zinc-200 font-semibold">$1</strong>')
        .replace(/^(#{1,3})\s+(.+)$/gm, (_, h, t) => `<h${h.length+1} class="text-${['lg','base','sm'][h.length-1]} font-semibold text-zinc-100 mt-6 mb-3">${t}</h${h.length+1}>`)
        .replace(/^[-•]\s+(.+)$/gm, '<li class="ml-4">$1</li>')
        .replace(/^(\d+[\.\)])\s+(.+)$/gm, '<div class="flex gap-3 my-2"><span class="text-indigo-400 font-medium shrink-0">$1</span><span>$2</span></div>')
        .replace(/\n\n/g, '</p><p class="mb-4">')
        .replace(/\n/g, '<br>');
    }

    function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
    function escapeRegex(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function formatRelativeTime(dateStr) {
      const diff = Date.now() - new Date(dateStr);
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'Just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(diff / 3600000);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(diff / 86400000);
      if (days < 7) return `${days}d ago`;
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // ============================================
    // KEYBOARD SHORTCUTS
    // ============================================
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        if (e.key === 'Escape') e.target.blur();
        return;
      }
      
      if (e.key === '/' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); document.getElementById('search-input').focus(); }
      else if (e.key === '?' && e.shiftKey) { e.preventDefault(); showShortcuts(); }
      else if (e.key === 'Escape') { closeModal(); hideDetailPanel(); }
      else if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); navigateBriefing(1); }
      else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); navigateBriefing(-1); }
      else if (e.key === 'Enter' && selectedIndex >= 0) { viewBriefing(briefings[selectedIndex].id); }
      else if (e.key === 's' && !e.shiftKey && selectedId) { toggleStar(selectedId); }
      else if (e.key === 'S' && e.shiftKey && selectedId) { showShareModal(selectedId); }
      else if (e.key === 'e' && !e.ctrlKey && selectedId) { archiveBriefing(selectedId); }
      else if (e.key === 'e' && e.ctrlKey) { e.preventDefault(); exportAll(); }
      else if (e.key === 'r' && !e.ctrlKey && !e.metaKey) { refreshBriefings(); }
    });

    function navigateBriefing(dir) {
      if (briefings.length === 0) return;
      selectedIndex = Math.max(0, Math.min(briefings.length - 1, selectedIndex + dir));
      selectedId = briefings[selectedIndex].id;
      renderBriefingList();
      document.querySelector(`[data-index="${selectedIndex}"]`)?.scrollIntoView({ block: 'nearest' });
    }

    // Search
    let searchTimeout;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = e.target.value.trim();
        if (searchQuery) {
          currentFilter = null; starredFilter = false; archivedFilter = false; tagFilter = null;
          updateActiveFilter(null);
          document.getElementById('current-filter').textContent = `Search: "${searchQuery}"`;
        } else {
          document.getElementById('current-filter').textContent = 'All Briefings';
          updateActiveFilter('all');
        }
        fetchBriefings();
      }, 300);
    });

    // ============================================
    // INITIALIZATION
    // ============================================
    fetchBriefings();
    fetchStats();
    fetchTags();
    setInterval(refreshBriefings, 5 * 60 * 1000);

    // PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
