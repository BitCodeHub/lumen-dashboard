<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen · Intelligence Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: {
              50: '#fafafa',
              100: '#f4f4f5',
              200: '#e4e4e7',
              800: '#18181b',
              850: '#141416',
              900: '#0c0c0e',
              950: '#09090b'
            },
            accent: {
              DEFAULT: '#6366f1',
              hover: '#818cf8',
              muted: 'rgba(99, 102, 241, 0.15)'
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { background: #0c0c0e; }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    
    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    .animate-pulse-subtle { animation: pulse-subtle 2s ease-in-out infinite; }
    
    .skeleton {
      background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    
    /* Briefing content */
    .prose { line-height: 1.7; }
    .prose p { margin-bottom: 1rem; }
    .prose strong { color: #f4f4f5; font-weight: 600; }
    .prose a { color: #818cf8; text-decoration: none; }
    .prose a:hover { text-decoration: underline; }
    .prose ul, .prose ol { margin: 1rem 0; padding-left: 1.5rem; }
    .prose li { margin: 0.5rem 0; }
    .prose code { background: #27272a; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.875rem; }
    
    /* Transitions */
    .nav-item { transition: all 0.15s ease; }
    .briefing-card { transition: all 0.15s ease; }
    .briefing-card:hover { background: rgba(39, 39, 42, 0.5); }
    
    /* Active states */
    .nav-item.active { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 20px;
      background: #6366f1;
      border-radius: 0 2px 2px 0;
    }
    
    /* Glow effects */
    .glow-accent { box-shadow: 0 0 20px rgba(99, 102, 241, 0.15); }
    
    /* Badge styles */
    .badge {
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.025em;
      text-transform: uppercase;
    }
  </style>
</head>
<body class="text-zinc-300 min-h-screen antialiased">
  <div class="flex h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-60 bg-surface-950 border-r border-zinc-800/50 flex flex-col">
      <!-- Brand -->
      <div class="h-14 px-4 flex items-center border-b border-zinc-800/50">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div>
            <span class="font-semibold text-zinc-100 text-sm">Lumen</span>
            <span class="text-zinc-500 text-xs ml-1">Dashboard</span>
          </div>
        </div>
      </div>
      
      <!-- Navigation -->
      <nav class="flex-1 py-3 px-2 overflow-y-auto">
        <div class="mb-6">
          <div class="px-3 py-2">
            <span class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">Briefings</span>
          </div>
          <div class="space-y-0.5">
            <button onclick="filterBy(null)" class="nav-item active relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3" data-filter="all">
              <svg class="w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z" />
              </svg>
              <span>All Briefings</span>
              <span id="count-all" class="ml-auto text-xs text-zinc-500 tabular-nums">—</span>
            </button>
            
            <button onclick="filterBy('morning-briefing')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="morning-briefing">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
              </svg>
              <span>Morning</span>
              <span id="count-morning" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
            
            <button onclick="filterBy('ai-opportunities')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="ai-opportunities">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.383a14.406 14.406 0 01-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 10-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" />
              </svg>
              <span>AI Opportunities</span>
              <span id="count-ai" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
            
            <button onclick="filterBy('email')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="email">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
              </svg>
              <span>Email Digest</span>
              <span id="count-email" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
            
            <button onclick="filterBy('traffic')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="traffic">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12" />
              </svg>
              <span>Traffic</span>
              <span id="count-traffic" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
            
            <button onclick="filterBy('evening-wrap')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="evening-wrap">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
              </svg>
              <span>Evening Wrap</span>
              <span id="count-evening" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
          </div>
        </div>
        
        <div class="border-t border-zinc-800/50 pt-3">
          <div class="px-3 py-2">
            <span class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">Saved</span>
          </div>
          <button onclick="filterStarred()" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="starred">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" />
            </svg>
            <span>Starred</span>
            <span id="count-starred" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
          </button>
        </div>
      </nav>
      
      <!-- Stats Footer -->
      <div class="p-4 border-t border-zinc-800/50 bg-zinc-900/30">
        <div id="stats" class="grid grid-cols-3 gap-2 text-center">
          <div class="p-2 rounded-md bg-zinc-800/30">
            <div id="stat-total" class="text-lg font-semibold text-zinc-100 tabular-nums">—</div>
            <div class="text-[10px] text-zinc-500 uppercase tracking-wide">Total</div>
          </div>
          <div class="p-2 rounded-md bg-zinc-800/30">
            <div id="stat-unread" class="text-lg font-semibold text-indigo-400 tabular-nums">—</div>
            <div class="text-[10px] text-zinc-500 uppercase tracking-wide">Unread</div>
          </div>
          <div class="p-2 rounded-md bg-zinc-800/30">
            <div id="stat-starred" class="text-lg font-semibold text-amber-400 tabular-nums">—</div>
            <div class="text-[10px] text-zinc-500 uppercase tracking-wide">Saved</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden bg-surface-900">
      <!-- Header -->
      <header class="h-14 px-6 flex items-center justify-between border-b border-zinc-800/50 bg-surface-950/50 backdrop-blur-sm">
        <div class="flex items-center gap-4">
          <h1 id="current-filter" class="text-sm font-medium text-zinc-100">All Briefings</h1>
          <span class="text-zinc-600">·</span>
          <span id="briefing-count" class="text-sm text-zinc-500">Loading...</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="refreshBriefings()" class="h-8 px-3 text-xs font-medium text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 rounded-md transition-colors flex items-center gap-2">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
            </svg>
            Refresh
          </button>
          <div class="w-px h-5 bg-zinc-800"></div>
          <div class="flex items-center gap-2 text-xs text-zinc-500">
            <span class="flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse-subtle"></span>
              Live
            </span>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="flex-1 flex overflow-hidden">
        <!-- Briefing List -->
        <div class="w-80 border-r border-zinc-800/50 flex flex-col bg-surface-950/30">
          <div id="briefing-list" class="flex-1 overflow-y-auto">
            <div class="p-6">
              <div class="space-y-3">
                <div class="h-20 rounded-lg skeleton"></div>
                <div class="h-20 rounded-lg skeleton"></div>
                <div class="h-20 rounded-lg skeleton"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Briefing Detail -->
        <div id="briefing-detail" class="flex-1 overflow-y-auto">
          <div class="flex items-center justify-center h-full">
            <div class="text-center">
              <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-zinc-800/50 flex items-center justify-center">
                <svg class="w-8 h-8 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                </svg>
              </div>
              <p class="text-sm text-zinc-500">Select a briefing to view</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let currentFilter = null;
    let starredFilter = false;
    let briefings = [];
    let selectedId = null;

    const typeConfig = {
      'morning-briefing': { label: 'Morning Briefing', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30', icon: 'sun' },
      'ai-opportunities': { label: 'AI Opportunity', color: 'bg-violet-500/20 text-violet-400 border-violet-500/30', icon: 'lightbulb' },
      'traffic': { label: 'Traffic Update', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30', icon: 'car' },
      'email': { label: 'Email Digest', color: 'bg-blue-500/20 text-blue-400 border-blue-500/30', icon: 'mail' },
      'evening-wrap': { label: 'Evening Wrap', color: 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30', icon: 'moon' },
      'ai-radar': { label: 'AI Radar', color: 'bg-pink-500/20 text-pink-400 border-pink-500/30', icon: 'radar' }
    };

    async function fetchBriefings() {
      const params = new URLSearchParams();
      if (currentFilter) params.append('type', currentFilter);
      if (starredFilter) params.append('starred', 'true');
      params.append('limit', '100');

      const res = await fetch(`/api/briefings?${params}`);
      briefings = await res.json();
      renderBriefingList();
      updateCount();
    }

    async function fetchStats() {
      const res = await fetch('/api/stats');
      const stats = await res.json();
      
      document.getElementById('stat-total').textContent = stats.total;
      document.getElementById('stat-unread').textContent = stats.unread;
      document.getElementById('stat-starred').textContent = stats.starred;
      
      document.getElementById('count-all').textContent = stats.total;
      document.getElementById('count-starred').textContent = stats.starred;
      
      // Update category counts
      const types = stats.byType || {};
      document.getElementById('count-morning').textContent = types['morning-briefing'] || 0;
      document.getElementById('count-ai').textContent = types['ai-opportunities'] || 0;
      document.getElementById('count-email').textContent = types['email'] || 0;
      document.getElementById('count-traffic').textContent = types['traffic'] || 0;
      document.getElementById('count-evening').textContent = types['evening-wrap'] || 0;
    }

    function renderBriefingList() {
      const list = document.getElementById('briefing-list');
      
      if (briefings.length === 0) {
        list.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full py-12 px-6">
            <div class="w-12 h-12 rounded-xl bg-zinc-800/50 flex items-center justify-center mb-4">
              <svg class="w-6 h-6 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 012.012 1.244l.256.512a2.25 2.25 0 002.013 1.244h3.218a2.25 2.25 0 002.013-1.244l.256-.512a2.25 2.25 0 012.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 00-2.15-1.588H6.911a2.25 2.25 0 00-2.15 1.588L2.35 13.177a2.25 2.25 0 00-.1.661z" />
              </svg>
            </div>
            <p class="text-sm font-medium text-zinc-400 mb-1">No briefings yet</p>
            <p class="text-xs text-zinc-600 text-center">Briefings will appear here as they're generated</p>
          </div>
        `;
        return;
      }

      list.innerHTML = `<div class="divide-y divide-zinc-800/50">` + briefings.map(b => {
        const type = typeConfig[b.type] || { label: b.type, color: 'bg-zinc-500/20 text-zinc-400 border-zinc-500/30' };
        const date = formatRelativeTime(b.created_at);
        const isSelected = selectedId === b.id;
        const isUnread = !b.read;
        
        return `
          <div onclick="viewBriefing(${b.id})" 
               class="briefing-card p-4 cursor-pointer ${isSelected ? 'bg-zinc-800/50 border-l-2 border-l-indigo-500' : 'border-l-2 border-l-transparent'} ${isUnread ? '' : 'opacity-70'}">
            <div class="flex items-start justify-between gap-3 mb-2">
              <span class="badge px-2 py-0.5 rounded border ${type.color}">${type.label}</span>
              <div class="flex items-center gap-2 shrink-0">
                ${b.starred ? '<svg class="w-3.5 h-3.5 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>' : ''}
                ${isUnread ? '<span class="w-2 h-2 rounded-full bg-indigo-500"></span>' : ''}
              </div>
            </div>
            <h3 class="text-sm font-medium text-zinc-200 mb-1.5 line-clamp-2">${escapeHtml(b.title)}</h3>
            <p class="text-xs text-zinc-500">${date}</p>
          </div>
        `;
      }).join('') + '</div>';
    }

    async function viewBriefing(id) {
      selectedId = id;
      renderBriefingList();
      
      const res = await fetch(`/api/briefings/${id}`);
      const b = await res.json();
      const type = typeConfig[b.type] || { label: b.type, color: 'bg-zinc-500/20 text-zinc-400 border-zinc-500/30' };
      const date = new Date(b.created_at).toLocaleString('en-US', { 
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', 
        hour: 'numeric', minute: '2-digit' 
      });

      document.getElementById('briefing-detail').innerHTML = `
        <div class="animate-fade-in max-w-3xl mx-auto p-8">
          <!-- Header -->
          <div class="mb-8">
            <div class="flex items-center justify-between mb-4">
              <span class="badge px-2.5 py-1 rounded border ${type.color}">${type.label}</span>
              <div class="flex items-center gap-1">
                <button onclick="toggleStar(${b.id})" class="p-2 rounded-md hover:bg-zinc-800 transition-colors" title="${b.starred ? 'Remove star' : 'Add star'}">
                  ${b.starred 
                    ? '<svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>'
                    : '<svg class="w-4 h-4 text-zinc-500 hover:text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>'
                  }
                </button>
                <button onclick="deleteBriefing(${b.id})" class="p-2 rounded-md hover:bg-zinc-800 text-zinc-500 hover:text-red-400 transition-colors" title="Delete">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                  </svg>
                </button>
              </div>
            </div>
            <h1 class="text-2xl font-semibold text-zinc-100 mb-2 leading-tight">${escapeHtml(b.title)}</h1>
            <p class="text-sm text-zinc-500">${date}</p>
          </div>
          
          ${b.summary ? `
          <div class="mb-8 p-4 rounded-lg bg-zinc-800/30 border border-zinc-700/50">
            <div class="flex items-center gap-2 mb-2">
              <svg class="w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 00-1.883 2.542l.857 6a2.25 2.25 0 002.227 1.932H19.05a2.25 2.25 0 002.227-1.932l.857-6a2.25 2.25 0 00-1.883-2.542m-16.5 0V6A2.25 2.25 0 016 3.75h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18A2.25 2.25 0 0120.25 9v.776" />
              </svg>
              <span class="text-xs font-medium text-zinc-400 uppercase tracking-wide">Summary</span>
            </div>
            <p class="text-sm text-zinc-300 leading-relaxed">${escapeHtml(b.summary)}</p>
          </div>
          ` : ''}
          
          <div class="prose text-zinc-300 text-sm leading-relaxed">${formatContent(b.content)}</div>
        </div>
      `;
      
      fetchBriefings();
      fetchStats();
    }

    function formatContent(content) {
      return escapeHtml(content)
        .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener" class="text-indigo-400 hover:text-indigo-300">$1</a>')
        .replace(/\*\*(.+?)\*\*/g, '<strong class="text-zinc-200 font-semibold">$1</strong>')
        .replace(/^(#{1,3})\s+(.+)$/gm, (_, hashes, text) => {
          const level = hashes.length;
          const sizes = { 1: 'text-lg', 2: 'text-base', 3: 'text-sm' };
          return `<h${level + 1} class="${sizes[level]} font-semibold text-zinc-100 mt-6 mb-3">${text}</h${level + 1}>`;
        })
        .replace(/^[-•]\s+(.+)$/gm, '<li class="ml-4">$1</li>')
        .replace(/^(\d+[\.\)])\s+(.+)$/gm, '<div class="flex gap-3 my-2"><span class="text-indigo-400 font-medium shrink-0">$1</span><span>$2</span></div>')
        .replace(/\n\n/g, '</p><p class="mb-4">')
        .replace(/\n/g, '<br>');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatRelativeTime(dateStr) {
      const date = new Date(dateStr);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      
      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays < 7) return `${diffDays}d ago`;
      
      return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    async function toggleStar(id) {
      await fetch(`/api/briefings/${id}/star`, { method: 'PATCH' });
      viewBriefing(id);
    }

    async function deleteBriefing(id) {
      if (!confirm('Delete this briefing?')) return;
      await fetch(`/api/briefings/${id}`, { method: 'DELETE' });
      selectedId = null;
      document.getElementById('briefing-detail').innerHTML = `
        <div class="flex items-center justify-center h-full">
          <div class="text-center">
            <div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800/50 flex items-center justify-center">
              <svg class="w-6 h-6 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <p class="text-sm text-zinc-500">Briefing deleted</p>
          </div>
        </div>
      `;
      fetchBriefings();
      fetchStats();
    }

    function filterBy(type) {
      currentFilter = type;
      starredFilter = false;
      updateActiveFilter(type || 'all');
      document.getElementById('current-filter').textContent = type ? typeConfig[type]?.label || type : 'All Briefings';
      selectedId = null;
      fetchBriefings();
    }

    function filterStarred() {
      starredFilter = true;
      currentFilter = null;
      updateActiveFilter('starred');
      document.getElementById('current-filter').textContent = 'Starred';
      selectedId = null;
      fetchBriefings();
    }

    function updateActiveFilter(filter) {
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.remove('active', 'text-zinc-200');
        btn.classList.add('text-zinc-400');
        if (btn.dataset.filter === filter) {
          btn.classList.add('active');
          btn.classList.remove('text-zinc-400');
        }
      });
    }

    function updateCount() {
      const count = briefings.length;
      document.getElementById('briefing-count').textContent = `${count} briefing${count !== 1 ? 's' : ''}`;
    }

    function refreshBriefings() {
      fetchBriefings();
      fetchStats();
    }

    // Initial load
    fetchBriefings();
    fetchStats();
    
    // Auto-refresh every 5 minutes
    setInterval(refreshBriefings, 5 * 60 * 1000);
  </script>
</body>
</html>
