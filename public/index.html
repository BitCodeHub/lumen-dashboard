<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumen · Intelligence Dashboard</title>
  <meta name="description" content="Intelligence briefings and research dashboard">
  <meta name="theme-color" content="#6366f1">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔆</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: { 50: '#fafafa', 100: '#f4f4f5', 200: '#e4e4e7', 800: '#18181b', 850: '#141416', 900: '#0c0c0e', 950: '#09090b' },
            accent: { DEFAULT: '#6366f1', hover: '#818cf8', muted: 'rgba(99, 102, 241, 0.15)' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { background: #0c0c0e; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    
    .animate-fade-in { animation: fadeIn 0.2s ease-out; }
    .animate-slide-in { animation: slideIn 0.2s ease-out; }
    .animate-pulse-subtle { animation: pulse-subtle 2s ease-in-out infinite; }
    .skeleton { background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    
    .prose { line-height: 1.7; }
    .prose p { margin-bottom: 1rem; }
    .prose strong { color: #f4f4f5; font-weight: 600; }
    .prose a { color: #818cf8; }
    .prose a:hover { text-decoration: underline; }
    
    .nav-item { transition: all 0.15s ease; }
    .briefing-card { transition: all 0.15s ease; }
    .briefing-card:hover { background: rgba(39, 39, 42, 0.5); }
    .nav-item.active { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; }
    .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: #6366f1; border-radius: 0 2px 2px 0; }
    
    .badge { font-size: 0.6875rem; font-weight: 500; letter-spacing: 0.025em; text-transform: uppercase; }
    .tag { font-size: 0.625rem; padding: 2px 6px; border-radius: 4px; background: rgba(99, 102, 241, 0.2); color: #a5b4fc; }
    
    .modal-backdrop { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }
    .modal { background: #18181b; border: 1px solid #27272a; }
    
    .kbd { font-size: 0.625rem; padding: 2px 5px; background: #27272a; border: 1px solid #3f3f46; border-radius: 4px; font-family: monospace; }
    
    .chart-bar { transition: height 0.3s ease; }
    
    .search-highlight { background: rgba(99, 102, 241, 0.3); padding: 1px 2px; border-radius: 2px; }
  </style>
</head>
<body class="text-zinc-300 min-h-screen antialiased">
  <div class="flex h-screen overflow-hidden">
    
    <!-- Sidebar -->
    <aside class="w-60 bg-surface-950 border-r border-zinc-800/50 flex flex-col">
      <!-- Brand -->
      <div class="h-14 px-4 flex items-center border-b border-zinc-800/50">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div>
            <span class="font-semibold text-zinc-100 text-sm">Lumen</span>
            <span class="text-zinc-500 text-xs ml-1">v2.0</span>
          </div>
        </div>
      </div>
      
      <!-- Search -->
      <div class="p-3 border-b border-zinc-800/50">
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="text" id="search-input" placeholder="Search... (/)" 
                 class="w-full h-9 pl-9 pr-3 text-sm bg-zinc-800/50 border border-zinc-700/50 rounded-lg text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500/50 focus:ring-1 focus:ring-indigo-500/30">
        </div>
      </div>
      
      <!-- Navigation -->
      <nav class="flex-1 py-3 px-2 overflow-y-auto">
        <div class="mb-4">
          <div class="px-3 py-2">
            <span class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">Briefings</span>
          </div>
          <div class="space-y-0.5" id="nav-filters">
            <button onclick="filterBy(null)" class="nav-item active relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3" data-filter="all">
              <svg class="w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 010 3.75H5.625a1.875 1.875 0 010-3.75z" /></svg>
              <span>All</span>
              <span id="count-all" class="ml-auto text-xs text-zinc-500 tabular-nums">—</span>
            </button>
            <button onclick="filterBy('morning-briefing')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="morning-briefing">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
              <span>Morning</span>
              <span id="count-morning" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
            <button onclick="filterBy('ai-opportunities')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="ai-opportunities">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.383a14.406 14.406 0 01-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 10-7.517 0c.85.493 1.509 1.333 1.509 2.316V18" /></svg>
              <span>AI Opportunities</span>
              <span id="count-ai" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
            <button onclick="filterBy('email')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="email">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" /></svg>
              <span>Email</span>
              <span id="count-email" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
            <button onclick="filterBy('traffic')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="traffic">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25m0 0V4.5m0 0H9.75" /></svg>
              <span>Traffic</span>
              <span id="count-traffic" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
            <button onclick="filterBy('evening-wrap')" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="evening-wrap">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
              <span>Evening</span>
              <span id="count-evening" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
            </button>
          </div>
        </div>
        
        <div class="border-t border-zinc-800/50 pt-3 mb-4">
          <div class="px-3 py-2">
            <span class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">Saved</span>
          </div>
          <button onclick="filterStarred()" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="starred">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z" /></svg>
            <span>Starred</span>
            <span id="count-starred" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
          </button>
          <button onclick="filterArchived()" class="nav-item relative w-full text-left px-3 py-2 rounded-md text-sm flex items-center gap-3 text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50" data-filter="archived">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" /></svg>
            <span>Archived</span>
            <span id="count-archived" class="ml-auto text-xs text-zinc-600 tabular-nums">—</span>
          </button>
        </div>
        
        <!-- Tags -->
        <div class="border-t border-zinc-800/50 pt-3">
          <div class="px-3 py-2 flex items-center justify-between">
            <span class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wider">Tags</span>
          </div>
          <div id="tags-list" class="px-3 space-y-1">
            <div class="text-xs text-zinc-600">No tags yet</div>
          </div>
        </div>
      </nav>
      
      <!-- Footer -->
      <div class="p-3 border-t border-zinc-800/50">
        <button onclick="showAnalytics()" class="w-full h-9 px-3 text-xs font-medium text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50 rounded-md transition-colors flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" /></svg>
          Analytics
        </button>
        <div class="mt-2 text-[10px] text-zinc-600 text-center">
          Press <span class="kbd">?</span> for shortcuts
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col overflow-hidden bg-surface-900">
      <!-- Header -->
      <header class="h-14 px-6 flex items-center justify-between border-b border-zinc-800/50 bg-surface-950/50 backdrop-blur-sm shrink-0">
        <div class="flex items-center gap-4">
          <h1 id="current-filter" class="text-sm font-medium text-zinc-100">All Briefings</h1>
          <span class="text-zinc-700">·</span>
          <span id="briefing-count" class="text-sm text-zinc-500">Loading...</span>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="exportAll()" class="h-8 px-3 text-xs font-medium text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 rounded-md transition-colors flex items-center gap-2" title="Export all (Ctrl+E)">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
            Export
          </button>
          <button onclick="refreshBriefings()" class="h-8 px-3 text-xs font-medium text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800 rounded-md transition-colors flex items-center gap-2" title="Refresh (R)">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
            Refresh
          </button>
          <div class="w-px h-5 bg-zinc-800"></div>
          <div class="flex items-center gap-2 text-xs text-zinc-500">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse-subtle"></span>
            Live
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div class="flex-1 flex overflow-hidden">
        <!-- Briefing List -->
        <div class="w-80 border-r border-zinc-800/50 flex flex-col bg-surface-950/30 shrink-0">
          <div id="briefing-list" class="flex-1 overflow-y-auto">
            <div class="p-6"><div class="space-y-3"><div class="h-20 rounded-lg skeleton"></div><div class="h-20 rounded-lg skeleton"></div><div class="h-20 rounded-lg skeleton"></div></div></div>
          </div>
        </div>

        <!-- Briefing Detail -->
        <div id="briefing-detail" class="flex-1 overflow-y-auto">
          <div class="flex items-center justify-center h-full">
            <div class="text-center">
              <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-zinc-800/50 flex items-center justify-center">
                <svg class="w-8 h-8 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" /></svg>
              </div>
              <p class="text-sm text-zinc-500">Select a briefing to view</p>
              <p class="text-xs text-zinc-600 mt-1">Use <span class="kbd">J</span>/<span class="kbd">K</span> to navigate</p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modals -->
  <div id="modal-container" class="hidden fixed inset-0 z-50"></div>
  
  <!-- Keyboard Shortcuts Modal -->
  <template id="shortcuts-modal-template">
    <div class="modal-backdrop fixed inset-0 flex items-center justify-center p-4" onclick="closeModal(event)">
      <div class="modal rounded-xl shadow-2xl w-full max-w-lg animate-fade-in" onclick="event.stopPropagation()">
        <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-zinc-100">Keyboard Shortcuts</h2>
          <button onclick="closeModal()" class="p-1 hover:bg-zinc-800 rounded-md text-zinc-400 hover:text-zinc-200"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
        </div>
        <div class="p-4 space-y-4">
          <div class="grid grid-cols-2 gap-4 text-sm">
            <div class="space-y-2">
              <h3 class="font-medium text-zinc-300">Navigation</h3>
              <div class="flex justify-between text-zinc-400"><span>Next briefing</span><span class="kbd">J</span></div>
              <div class="flex justify-between text-zinc-400"><span>Previous briefing</span><span class="kbd">K</span></div>
              <div class="flex justify-between text-zinc-400"><span>Open briefing</span><span class="kbd">Enter</span></div>
              <div class="flex justify-between text-zinc-400"><span>Search</span><span class="kbd">/</span></div>
            </div>
            <div class="space-y-2">
              <h3 class="font-medium text-zinc-300">Actions</h3>
              <div class="flex justify-between text-zinc-400"><span>Star/unstar</span><span class="kbd">S</span></div>
              <div class="flex justify-between text-zinc-400"><span>Archive</span><span class="kbd">E</span></div>
              <div class="flex justify-between text-zinc-400"><span>Share</span><span class="kbd">Shift+S</span></div>
              <div class="flex justify-between text-zinc-400"><span>Refresh</span><span class="kbd">R</span></div>
              <div class="flex justify-between text-zinc-400"><span>Export all</span><span class="kbd">Ctrl+E</span></div>
              <div class="flex justify-between text-zinc-400"><span>Show shortcuts</span><span class="kbd">?</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Analytics Modal -->
  <template id="analytics-modal-template">
    <div class="modal-backdrop fixed inset-0 flex items-center justify-center p-4" onclick="closeModal(event)">
      <div class="modal rounded-xl shadow-2xl w-full max-w-3xl animate-fade-in max-h-[90vh] overflow-hidden flex flex-col" onclick="event.stopPropagation()">
        <div class="p-4 border-b border-zinc-800 flex items-center justify-between shrink-0">
          <h2 class="text-lg font-semibold text-zinc-100">Analytics</h2>
          <button onclick="closeModal()" class="p-1 hover:bg-zinc-800 rounded-md text-zinc-400 hover:text-zinc-200"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
        </div>
        <div class="p-6 overflow-y-auto" id="analytics-content">
          <div class="flex items-center justify-center py-12"><div class="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>
        </div>
      </div>
    </div>
  </template>

  <!-- Share Modal -->
  <template id="share-modal-template">
    <div class="modal-backdrop fixed inset-0 flex items-center justify-center p-4" onclick="closeModal(event)">
      <div class="modal rounded-xl shadow-2xl w-full max-w-md animate-fade-in" onclick="event.stopPropagation()">
        <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-zinc-100">Share Briefing</h2>
          <button onclick="closeModal()" class="p-1 hover:bg-zinc-800 rounded-md text-zinc-400 hover:text-zinc-200"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
        </div>
        <div class="p-4" id="share-content"></div>
      </div>
    </div>
  </template>

  <!-- Tag Modal -->
  <template id="tag-modal-template">
    <div class="modal-backdrop fixed inset-0 flex items-center justify-center p-4" onclick="closeModal(event)">
      <div class="modal rounded-xl shadow-2xl w-full max-w-sm animate-fade-in" onclick="event.stopPropagation()">
        <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
          <h2 class="text-lg font-semibold text-zinc-100">Add Tag</h2>
          <button onclick="closeModal()" class="p-1 hover:bg-zinc-800 rounded-md text-zinc-400 hover:text-zinc-200"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>
        </div>
        <div class="p-4">
          <input type="text" id="new-tag-input" placeholder="Enter tag name" class="w-full h-10 px-3 text-sm bg-zinc-800 border border-zinc-700 rounded-lg text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500" onkeydown="if(event.key==='Enter')addTagFromInput()">
          <div class="mt-3 flex justify-end gap-2">
            <button onclick="closeModal()" class="px-3 py-2 text-sm text-zinc-400 hover:text-zinc-200">Cancel</button>
            <button onclick="addTagFromInput()" class="px-3 py-2 text-sm bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg">Add Tag</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script>
    // State
    let currentFilter = null;
    let starredFilter = false;
    let archivedFilter = false;
    let tagFilter = null;
    let searchQuery = '';
    let briefings = [];
    let selectedId = null;
    let selectedIndex = -1;

    const typeConfig = {
      'morning-briefing': { label: 'Morning Briefing', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' },
      'ai-opportunities': { label: 'AI Opportunity', color: 'bg-violet-500/20 text-violet-400 border-violet-500/30' },
      'traffic': { label: 'Traffic', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' },
      'email': { label: 'Email Digest', color: 'bg-blue-500/20 text-blue-400 border-blue-500/30' },
      'evening-wrap': { label: 'Evening Wrap', color: 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' },
      'ai-radar': { label: 'AI Radar', color: 'bg-pink-500/20 text-pink-400 border-pink-500/30' }
    };

    // API Functions
    async function fetchBriefings() {
      const params = new URLSearchParams();
      if (currentFilter) params.append('type', currentFilter);
      if (starredFilter) params.append('starred', 'true');
      if (archivedFilter) params.append('archived', 'only');
      if (tagFilter) params.append('tag', tagFilter);
      if (searchQuery) params.append('q', searchQuery);
      params.append('limit', '100');

      const res = await fetch(`/api/briefings?${params}`);
      briefings = await res.json();
      renderBriefingList();
      updateCount();
    }

    async function fetchStats() {
      const res = await fetch('/api/stats');
      const stats = await res.json();
      
      document.getElementById('count-all').textContent = stats.total;
      document.getElementById('count-starred').textContent = stats.starred;
      
      const types = stats.byType || {};
      document.getElementById('count-morning').textContent = types['morning-briefing'] || 0;
      document.getElementById('count-ai').textContent = types['ai-opportunities'] || 0;
      document.getElementById('count-email').textContent = types['email'] || 0;
      document.getElementById('count-traffic').textContent = types['traffic'] || 0;
      document.getElementById('count-evening').textContent = types['evening-wrap'] || 0;
      
      // Fetch archived count
      const archivedRes = await fetch('/api/briefings?archived=only&limit=1000');
      const archived = await archivedRes.json();
      document.getElementById('count-archived').textContent = archived.length;
    }

    async function fetchTags() {
      const res = await fetch('/api/tags');
      const tags = await res.json();
      
      const container = document.getElementById('tags-list');
      if (tags.length === 0) {
        container.innerHTML = '<div class="text-xs text-zinc-600">No tags yet</div>';
        return;
      }
      
      container.innerHTML = tags.slice(0, 8).map(t => `
        <button onclick="filterByTag('${t.name}')" class="flex items-center gap-2 w-full px-2 py-1 rounded text-xs text-zinc-400 hover:text-zinc-200 hover:bg-zinc-800/50 ${tagFilter === t.name ? 'bg-zinc-800/50 text-zinc-200' : ''}">
          <span class="w-2 h-2 rounded-full bg-indigo-500/50"></span>
          <span class="truncate">${escapeHtml(t.name)}</span>
          <span class="ml-auto text-zinc-600">${t.count}</span>
        </button>
      `).join('');
    }

    // Render Functions
    function renderBriefingList() {
      const list = document.getElementById('briefing-list');
      
      if (briefings.length === 0) {
        list.innerHTML = `
          <div class="flex flex-col items-center justify-center h-full py-12 px-6">
            <div class="w-12 h-12 rounded-xl bg-zinc-800/50 flex items-center justify-center mb-4">
              <svg class="w-6 h-6 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 012.012 1.244l.256.512a2.25 2.25 0 002.013 1.244h3.218a2.25 2.25 0 002.013-1.244l.256-.512a2.25 2.25 0 012.013-1.244h3.859m-19.5.338V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18v-4.162c0-.224-.034-.447-.1-.661L19.24 5.338a2.25 2.25 0 00-2.15-1.588H6.911a2.25 2.25 0 00-2.15 1.588L2.35 13.177a2.25 2.25 0 00-.1.661z" /></svg>
            </div>
            <p class="text-sm font-medium text-zinc-400 mb-1">No briefings found</p>
            <p class="text-xs text-zinc-600 text-center">${searchQuery ? 'Try a different search' : 'Briefings will appear here'}</p>
          </div>`;
        return;
      }

      list.innerHTML = `<div class="divide-y divide-zinc-800/50">` + briefings.map((b, idx) => {
        const type = typeConfig[b.type] || { label: b.type, color: 'bg-zinc-500/20 text-zinc-400 border-zinc-500/30' };
        const date = formatRelativeTime(b.created_at);
        const isSelected = selectedId === b.id;
        const isUnread = !b.read;
        
        let title = escapeHtml(b.title);
        if (searchQuery) {
          const regex = new RegExp(`(${escapeRegex(searchQuery)})`, 'gi');
          title = title.replace(regex, '<span class="search-highlight">$1</span>');
        }
        
        return `
          <div onclick="viewBriefing(${b.id})" data-index="${idx}"
               class="briefing-card p-4 cursor-pointer ${isSelected ? 'bg-zinc-800/50 border-l-2 border-l-indigo-500' : 'border-l-2 border-l-transparent'} ${isUnread ? '' : 'opacity-70'}">
            <div class="flex items-start justify-between gap-2 mb-2">
              <span class="badge px-2 py-0.5 rounded border ${type.color}">${type.label}</span>
              <div class="flex items-center gap-1.5 shrink-0">
                ${b.starred ? '<svg class="w-3.5 h-3.5 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>' : ''}
                ${isUnread ? '<span class="w-2 h-2 rounded-full bg-indigo-500"></span>' : ''}
              </div>
            </div>
            <h3 class="text-sm font-medium text-zinc-200 mb-1.5 line-clamp-2">${title}</h3>
            <div class="flex items-center justify-between">
              <p class="text-xs text-zinc-500">${date}</p>
              ${b.tags && b.tags.length ? `<div class="flex gap-1">${b.tags.slice(0,2).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
            </div>
          </div>`;
      }).join('') + '</div>';
      
      if (selectedId) {
        selectedIndex = briefings.findIndex(b => b.id === selectedId);
      }
    }

    async function viewBriefing(id) {
      selectedId = id;
      selectedIndex = briefings.findIndex(b => b.id === id);
      renderBriefingList();
      
      const res = await fetch(`/api/briefings/${id}`);
      const b = await res.json();
      const type = typeConfig[b.type] || { label: b.type, color: 'bg-zinc-500/20 text-zinc-400 border-zinc-500/30' };
      const date = new Date(b.created_at).toLocaleString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });

      document.getElementById('briefing-detail').innerHTML = `
        <div class="animate-fade-in max-w-3xl mx-auto p-8">
          <div class="mb-6">
            <div class="flex items-center justify-between mb-4">
              <span class="badge px-2.5 py-1 rounded border ${type.color}">${type.label}</span>
              <div class="flex items-center gap-1">
                <button onclick="showTagModal(${b.id})" class="p-2 rounded-md hover:bg-zinc-800 text-zinc-500 hover:text-zinc-200 transition-colors" title="Add tag">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 003 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 005.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 009.568 3z" /><path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6z" /></svg>
                </button>
                <button onclick="toggleStar(${b.id})" class="p-2 rounded-md hover:bg-zinc-800 transition-colors" title="Star (S)">
                  ${b.starred ? '<svg class="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 24 24"><path d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>' : '<svg class="w-4 h-4 text-zinc-500 hover:text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>'}
                </button>
                <button onclick="showShareModal(${b.id})" class="p-2 rounded-md hover:bg-zinc-800 text-zinc-500 hover:text-zinc-200 transition-colors" title="Share (Shift+S)">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z" /></svg>
                </button>
                <button onclick="exportBriefing(${b.id})" class="p-2 rounded-md hover:bg-zinc-800 text-zinc-500 hover:text-zinc-200 transition-colors" title="Export">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3" /></svg>
                </button>
                <button onclick="archiveBriefing(${b.id})" class="p-2 rounded-md hover:bg-zinc-800 text-zinc-500 hover:text-zinc-200 transition-colors" title="Archive (E)">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5m19.5 0h-19.5m15.75 0v-.375c0-.621-.504-1.125-1.125-1.125H8.625c-.621 0-1.125.504-1.125 1.125v.375" /></svg>
                </button>
                <button onclick="deleteBriefing(${b.id})" class="p-2 rounded-md hover:bg-zinc-800 text-zinc-500 hover:text-red-400 transition-colors" title="Delete">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" /></svg>
                </button>
              </div>
            </div>
            <h1 class="text-2xl font-semibold text-zinc-100 mb-2 leading-tight">${escapeHtml(b.title)}</h1>
            <p class="text-sm text-zinc-500 mb-3">${date}</p>
            ${b.tags && b.tags.length ? `<div class="flex flex-wrap gap-2">${b.tags.map(t => `<span class="tag cursor-pointer hover:bg-indigo-500/30" onclick="filterByTag('${t}')">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          </div>
          
          ${b.summary ? `<div class="mb-6 p-4 rounded-lg bg-zinc-800/30 border border-zinc-700/50"><div class="flex items-center gap-2 mb-2"><svg class="w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 9.776c.112-.017.227-.026.344-.026h15.812c.117 0 .232.009.344.026m-16.5 0a2.25 2.25 0 00-1.883 2.542l.857 6a2.25 2.25 0 002.227 1.932H19.05a2.25 2.25 0 002.227-1.932l.857-6a2.25 2.25 0 00-1.883-2.542m-16.5 0V6A2.25 2.25 0 016 3.75h3.879a1.5 1.5 0 011.06.44l2.122 2.12a1.5 1.5 0 001.06.44H18A2.25 2.25 0 0120.25 9v.776" /></svg><span class="text-xs font-medium text-zinc-400 uppercase tracking-wide">Summary</span></div><p class="text-sm text-zinc-300 leading-relaxed">${escapeHtml(b.summary)}</p></div>` : ''}
          
          <div class="prose text-zinc-300 text-sm leading-relaxed">${formatContent(b.content)}</div>
        </div>`;
      
      fetchBriefings();
      fetchStats();
    }

    // Actions
    async function toggleStar(id) { await fetch(`/api/briefings/${id}/star`, { method: 'PATCH' }); viewBriefing(id); }
    
    async function archiveBriefing(id) {
      await fetch(`/api/briefings/${id}/archive`, { method: 'PATCH' });
      selectedId = null;
      document.getElementById('briefing-detail').innerHTML = `<div class="flex items-center justify-center h-full"><div class="text-center"><div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800/50 flex items-center justify-center"><svg class="w-6 h-6 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div><p class="text-sm text-zinc-500">Briefing archived</p></div></div>`;
      fetchBriefings(); fetchStats(); fetchTags();
    }

    async function deleteBriefing(id) {
      if (!confirm('Permanently delete this briefing?')) return;
      await fetch(`/api/briefings/${id}`, { method: 'DELETE' });
      selectedId = null;
      document.getElementById('briefing-detail').innerHTML = `<div class="flex items-center justify-center h-full"><div class="text-center"><div class="w-12 h-12 mx-auto mb-3 rounded-xl bg-zinc-800/50 flex items-center justify-center"><svg class="w-6 h-6 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg></div><p class="text-sm text-zinc-500">Briefing deleted</p></div></div>`;
      fetchBriefings(); fetchStats(); fetchTags();
    }

    function exportBriefing(id) { window.open(`/api/briefings/${id}/export?format=markdown`, '_blank'); }
    function exportAll() { window.open('/api/export?format=json', '_blank'); }

    // Filters
    function filterBy(type) {
      currentFilter = type; starredFilter = false; archivedFilter = false; tagFilter = null;
      updateActiveFilter(type || 'all');
      document.getElementById('current-filter').textContent = type ? typeConfig[type]?.label || type : 'All Briefings';
      selectedId = null; fetchBriefings();
    }

    function filterStarred() {
      starredFilter = true; currentFilter = null; archivedFilter = false; tagFilter = null;
      updateActiveFilter('starred');
      document.getElementById('current-filter').textContent = 'Starred';
      selectedId = null; fetchBriefings();
    }

    function filterArchived() {
      archivedFilter = true; currentFilter = null; starredFilter = false; tagFilter = null;
      updateActiveFilter('archived');
      document.getElementById('current-filter').textContent = 'Archived';
      selectedId = null; fetchBriefings();
    }

    function filterByTag(tag) {
      tagFilter = tag; currentFilter = null; starredFilter = false; archivedFilter = false;
      updateActiveFilter(null);
      document.getElementById('current-filter').textContent = `Tag: ${tag}`;
      selectedId = null; fetchBriefings(); fetchTags();
    }

    function updateActiveFilter(filter) {
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.classList.remove('active', 'text-zinc-200');
        btn.classList.add('text-zinc-400');
        if (btn.dataset.filter === filter) { btn.classList.add('active'); btn.classList.remove('text-zinc-400'); }
      });
    }

    function updateCount() {
      document.getElementById('briefing-count').textContent = `${briefings.length} briefing${briefings.length !== 1 ? 's' : ''}`;
    }

    function refreshBriefings() { fetchBriefings(); fetchStats(); fetchTags(); }

    // Modals
    function showModal(templateId) {
      const template = document.getElementById(templateId);
      const container = document.getElementById('modal-container');
      container.innerHTML = template.innerHTML;
      container.classList.remove('hidden');
    }

    function closeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('modal-container').classList.add('hidden');
    }

    function showShortcuts() { showModal('shortcuts-modal-template'); }

    async function showAnalytics() {
      showModal('analytics-modal-template');
      const res = await fetch('/api/analytics');
      const data = await res.json();
      
      const maxByDay = Math.max(...Object.values(data.byDay), 1);
      const days = Object.entries(data.byDay).slice(-14);
      
      document.getElementById('analytics-content').innerHTML = `
        <div class="grid grid-cols-4 gap-4 mb-8">
          <div class="p-4 rounded-lg bg-zinc-800/50"><div class="text-2xl font-semibold text-zinc-100">${data.total}</div><div class="text-xs text-zinc-500 uppercase tracking-wide">Total</div></div>
          <div class="p-4 rounded-lg bg-zinc-800/50"><div class="text-2xl font-semibold text-indigo-400">${data.unread}</div><div class="text-xs text-zinc-500 uppercase tracking-wide">Unread</div></div>
          <div class="p-4 rounded-lg bg-zinc-800/50"><div class="text-2xl font-semibold text-amber-400">${data.starred}</div><div class="text-xs text-zinc-500 uppercase tracking-wide">Starred</div></div>
          <div class="p-4 rounded-lg bg-zinc-800/50"><div class="text-2xl font-semibold text-emerald-400">${data.readRate}%</div><div class="text-xs text-zinc-500 uppercase tracking-wide">Read Rate</div></div>
        </div>
        <div class="mb-8">
          <h3 class="text-sm font-medium text-zinc-300 mb-4">Last 14 Days</h3>
          <div class="flex items-end gap-1 h-24">
            ${days.map(([date, count]) => `<div class="flex-1 flex flex-col items-center"><div class="chart-bar w-full bg-indigo-500/50 rounded-t" style="height:${(count/maxByDay)*100}%"></div><div class="text-[9px] text-zinc-600 mt-1">${new Date(date).getDate()}</div></div>`).join('')}
          </div>
        </div>
        <div class="grid grid-cols-2 gap-6">
          <div>
            <h3 class="text-sm font-medium text-zinc-300 mb-3">By Type</h3>
            <div class="space-y-2">
              ${Object.entries(data.byType).sort((a,b) => b[1]-a[1]).map(([type, count]) => {
                const cfg = typeConfig[type] || { label: type, color: 'bg-zinc-500/20 text-zinc-400' };
                return `<div class="flex items-center justify-between text-sm"><span class="badge px-2 py-0.5 rounded ${cfg.color}">${cfg.label}</span><span class="text-zinc-400">${count}</span></div>`;
              }).join('')}
            </div>
          </div>
          <div>
            <h3 class="text-sm font-medium text-zinc-300 mb-3">Top Tags</h3>
            <div class="space-y-2">
              ${data.topTags.length ? data.topTags.map(t => `<div class="flex items-center justify-between text-sm"><span class="tag">${escapeHtml(t.name)}</span><span class="text-zinc-400">${t.count}</span></div>`).join('') : '<div class="text-sm text-zinc-600">No tags yet</div>'}
            </div>
          </div>
        </div>`;
    }

    async function showShareModal(id) {
      showModal('share-modal-template');
      document.getElementById('share-content').innerHTML = '<div class="flex justify-center py-4"><div class="w-5 h-5 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>';
      
      const res = await fetch(`/api/briefings/${id}/share`, { method: 'POST' });
      const data = await res.json();
      
      document.getElementById('share-content').innerHTML = `
        <p class="text-sm text-zinc-400 mb-3">Anyone with this link can view this briefing:</p>
        <div class="flex gap-2">
          <input type="text" readonly value="${data.shareUrl}" class="flex-1 h-10 px-3 text-sm bg-zinc-800 border border-zinc-700 rounded-lg text-zinc-200" id="share-url-input">
          <button onclick="copyShareUrl()" class="px-4 h-10 bg-indigo-600 hover:bg-indigo-500 text-white text-sm rounded-lg">Copy</button>
        </div>
        <button onclick="revokeShare(${id})" class="mt-3 text-xs text-red-400 hover:text-red-300">Revoke link</button>`;
    }

    function copyShareUrl() {
      const input = document.getElementById('share-url-input');
      input.select();
      document.execCommand('copy');
    }

    async function revokeShare(id) {
      await fetch(`/api/briefings/${id}/share`, { method: 'DELETE' });
      closeModal();
    }

    function showTagModal(id) {
      showModal('tag-modal-template');
      document.getElementById('new-tag-input').dataset.briefingId = id;
      setTimeout(() => document.getElementById('new-tag-input').focus(), 100);
    }

    async function addTagFromInput() {
      const input = document.getElementById('new-tag-input');
      const tag = input.value.trim();
      const id = input.dataset.briefingId;
      if (!tag) return;
      
      await fetch(`/api/briefings/${id}/tags`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tag })
      });
      closeModal();
      viewBriefing(parseInt(id));
      fetchTags();
    }

    // Utilities
    function formatContent(content) {
      return escapeHtml(content)
        .replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener" class="text-indigo-400 hover:text-indigo-300">$1</a>')
        .replace(/\*\*(.+?)\*\*/g, '<strong class="text-zinc-200 font-semibold">$1</strong>')
        .replace(/^(#{1,3})\s+(.+)$/gm, (_, h, t) => `<h${h.length+1} class="text-${['lg','base','sm'][h.length-1]} font-semibold text-zinc-100 mt-6 mb-3">${t}</h${h.length+1}>`)
        .replace(/^[-•]\s+(.+)$/gm, '<li class="ml-4">$1</li>')
        .replace(/^(\d+[\.\)])\s+(.+)$/gm, '<div class="flex gap-3 my-2"><span class="text-indigo-400 font-medium shrink-0">$1</span><span>$2</span></div>')
        .replace(/\n\n/g, '</p><p class="mb-4">')
        .replace(/\n/g, '<br>');
    }

    function escapeHtml(text) { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
    function escapeRegex(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function formatRelativeTime(dateStr) {
      const diff = Date.now() - new Date(dateStr);
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'Just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(diff / 3600000);
      if (hrs < 24) return `${hrs}h ago`;
      const days = Math.floor(diff / 86400000);
      if (days < 7) return `${days}d ago`;
      return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // Keyboard Shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
        if (e.key === 'Escape') e.target.blur();
        return;
      }
      
      if (e.key === '/' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); document.getElementById('search-input').focus(); }
      else if (e.key === '?' && e.shiftKey) { e.preventDefault(); showShortcuts(); }
      else if (e.key === 'Escape') closeModal();
      else if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); navigateBriefing(1); }
      else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); navigateBriefing(-1); }
      else if (e.key === 'Enter' && selectedIndex >= 0) { viewBriefing(briefings[selectedIndex].id); }
      else if (e.key === 's' && !e.shiftKey && selectedId) { toggleStar(selectedId); }
      else if (e.key === 'S' && e.shiftKey && selectedId) { showShareModal(selectedId); }
      else if (e.key === 'e' && !e.ctrlKey && selectedId) { archiveBriefing(selectedId); }
      else if (e.key === 'e' && e.ctrlKey) { e.preventDefault(); exportAll(); }
      else if (e.key === 'r' && !e.ctrlKey && !e.metaKey) { refreshBriefings(); }
    });

    function navigateBriefing(dir) {
      if (briefings.length === 0) return;
      selectedIndex = Math.max(0, Math.min(briefings.length - 1, selectedIndex + dir));
      selectedId = briefings[selectedIndex].id;
      renderBriefingList();
      document.querySelector(`[data-index="${selectedIndex}"]`)?.scrollIntoView({ block: 'nearest' });
    }

    // Search
    let searchTimeout;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = e.target.value.trim();
        if (searchQuery) {
          currentFilter = null; starredFilter = false; archivedFilter = false; tagFilter = null;
          updateActiveFilter(null);
          document.getElementById('current-filter').textContent = `Search: "${searchQuery}"`;
        } else {
          document.getElementById('current-filter').textContent = 'All Briefings';
          updateActiveFilter('all');
        }
        fetchBriefings();
      }, 300);
    });

    // Init
    fetchBriefings();
    fetchStats();
    fetchTags();
    setInterval(refreshBriefings, 5 * 60 * 1000);

    // PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
