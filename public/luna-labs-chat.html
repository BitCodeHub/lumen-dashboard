<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Labs AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            max-height: 700px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .header-text h1 { color: #fff; font-size: 20px; font-weight: 700; }
        .header-text p { color: rgba(255, 255, 255, 0.8); font-size: 13px; }
        .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #f8fafc;
        }
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .message.assistant .avatar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .message.user .avatar { background: #e2e8f0; }
        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
        }
        .message.assistant .bubble {
            background: #fff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .input-area {
            padding: 20px 24px;
            background: #fff;
            border-top: 1px solid #e2e8f0;
        }
        .input-wrapper { display: flex; gap: 12px; align-items: flex-end; }
        textarea {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-family: inherit;
            font-size: 15px;
            resize: none;
            outline: none;
            min-height: 52px;
            max-height: 120px;
        }
        textarea:focus { border-color: #667eea; }
        button {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .typing span {
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }
        .welcome { text-align: center; padding: 40px 20px; color: #64748b; }
        .welcome h2 { font-size: 24px; color: #1e293b; margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <div class="logo">🌙</div>
            <div class="header-text">
                <h1>Luna Labs</h1>
                <p>AI Assistant</p>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                <span>Online</span>
            </div>
        </div>
        
        <div class="messages" id="messages">
            <div class="welcome">
                <h2>Welcome to Luna Labs</h2>
                <p>I'm Maven, your AI assistant. How can I help you today?</p>
            </div>
        </div>
        
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="input" placeholder="Type your message..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button onclick="sendMessage()" id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = 'web-' + Date.now();
        
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        
        inputEl.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        function addMessage(content, role) {
            const welcome = messagesEl.querySelector('.welcome');
            if (welcome) welcome.remove();
            
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.innerHTML = `
                <div class="avatar">${role === 'assistant' ? '🌙' : '👤'}</div>
                <div class="bubble">${escapeHtml(content)}</div>
            `;
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function addTyping() {
            const msg = document.createElement('div');
            msg.className = 'message assistant';
            msg.id = 'typing';
            msg.innerHTML = `
                <div class="avatar">🌙</div>
                <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
            `;
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function removeTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text) return;
            
            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;
            
            addMessage(text, 'user');
            addTyping();
            
            try {
                const response = await fetch('/api/maven/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, sessionId: sessionId })
                });
                
                const data = await response.json();
                removeTyping();
                addMessage(data.response || 'No response received', 'assistant');
            } catch (error) {
                console.error('Error:', error);
                removeTyping();
                addMessage('Connection error. Please try again.', 'assistant');
            }
            
            sendBtn.disabled = false;
            inputEl.focus();
        }
        
        inputEl.focus();
    </script>
</body>
</html>
