<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maven - Luna Labs AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            max-height: 800px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .header-text h1 { color: #fff; font-size: 20px; font-weight: 700; }
        .header-text p { color: rgba(255, 255, 255, 0.8); font-size: 13px; }
        .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #4ade80;
            border-radius: 50%;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: #f8fafc;
        }
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
        .message.assistant .avatar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .message.user .avatar { background: #e2e8f0; }
        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
            white-space: pre-wrap;
        }
        .message.assistant .bubble {
            background: #fff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message.user .bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .input-area {
            padding: 16px 24px;
            background: #fff;
            border-top: 1px solid #e2e8f0;
        }
        .file-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .file-preview:empty { display: none; }
        .file-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #475569;
        }
        .file-chip .icon {
            font-size: 16px;
        }
        .file-chip .remove {
            cursor: pointer;
            color: #94a3b8;
            font-size: 18px;
            line-height: 1;
        }
        .file-chip .remove:hover { color: #ef4444; }
        .file-chip img.thumb {
            width: 32px;
            height: 32px;
            object-fit: cover;
            border-radius: 4px;
        }
        .input-wrapper { display: flex; gap: 12px; align-items: flex-end; }
        .attach-btn {
            width: 44px;
            height: 44px;
            background: #f1f5f9;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .attach-btn:hover { background: #e2e8f0; }
        textarea {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
        }
        textarea:focus { border-color: #667eea; }
        .send-btn {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .typing span {
            width: 6px;
            height: 6px;
            background: #94a3b8;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
        .welcome { text-align: center; padding: 40px 20px; color: #64748b; }
        .drop-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(102, 126, 234, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .drop-overlay.active { display: flex; }
        .drop-message {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
        }
        #file-input { display: none; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="header">
            <div class="logo">📋</div>
            <div class="header-text">
                <h1>Maven</h1>
                <p>Luna Labs AI Assistant</p>
            </div>
            <div class="status">
                <div class="status-dot"></div>
                Online
            </div>
        </div>
        
        <div class="messages" id="messages">
            <div class="welcome">
                <div style="font-size: 48px; margin-bottom: 16px;">📋</div>
                <h2 style="color: #1e293b; margin-bottom: 8px;">Hi! I'm Maven</h2>
                <p>Your AI assistant. Ask me anything or upload files to analyze.</p>
                <p style="margin-top: 8px; font-size: 12px;">Supports: Images, PDFs, Documents, Code files</p>
            </div>
        </div>
        
        <div class="input-area">
            <div class="file-preview" id="file-preview"></div>
            <div class="input-wrapper">
                <button class="attach-btn" onclick="document.getElementById('file-input').click()">📎</button>
                <input type="file" id="file-input" multiple accept="image/*,.pdf,.doc,.docx,.txt,.json,.csv,.vcf,.xlsx,.xls,.md,.js,.py,.ts,.html,.css">
                <textarea id="input" placeholder="Type a message..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>
    
    <div class="drop-overlay" id="drop-overlay">
        <div class="drop-message">📁 Drop files here</div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const fileInput = document.getElementById('file-input');
        const filePreview = document.getElementById('file-preview');
        const dropOverlay = document.getElementById('drop-overlay');
        const sessionId = 'chat-' + Date.now();
        
        let pendingFiles = [];
        
        // Auto-resize textarea
        inputEl.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
        
        // File input change
        fileInput.addEventListener('change', (e) => {
            addFiles(e.target.files);
            fileInput.value = '';
        });
        
        // Drag and drop
        document.addEventListener('dragenter', (e) => {
            e.preventDefault();
            dropOverlay.classList.add('active');
        });
        
        dropOverlay.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropOverlay.classList.remove('active');
        });
        
        dropOverlay.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        
        dropOverlay.addEventListener('drop', (e) => {
            e.preventDefault();
            dropOverlay.classList.remove('active');
            addFiles(e.dataTransfer.files);
        });
        
        function addFiles(fileList) {
            for (const file of fileList) {
                if (pendingFiles.length >= 10) {
                    alert('Maximum 10 files allowed');
                    break;
                }
                if (file.size > 50 * 1024 * 1024) {
                    alert(`File ${file.name} is too large (max 50MB)`);
                    continue;
                }
                pendingFiles.push(file);
            }
            renderFilePreview();
        }
        
        function renderFilePreview() {
            filePreview.innerHTML = pendingFiles.map((file, i) => {
                const icon = getFileIcon(file.type, file.name);
                const isImage = file.type.startsWith('image/');
                let thumb = '';
                if (isImage) {
                    thumb = `<img class="thumb" src="${URL.createObjectURL(file)}">`;
                }
                return `
                    <div class="file-chip">
                        ${thumb || `<span class="icon">${icon}</span>`}
                        <span>${truncate(file.name, 20)}</span>
                        <span class="remove" onclick="removeFile(${i})">×</span>
                    </div>
                `;
            }).join('');
        }
        
        function removeFile(index) {
            pendingFiles.splice(index, 1);
            renderFilePreview();
        }
        
        function getFileIcon(type, name) {
            if (type.startsWith('image/')) return '🖼️';
            if (type === 'application/pdf') return '📄';
            if (name.endsWith('.vcf')) return '👤';
            if (name.match(/\.(doc|docx)$/)) return '📝';
            if (name.match(/\.(xls|xlsx)$/)) return '📊';
            if (name.match(/\.(js|ts|py|rb|go|rs|java|cpp|c|h)$/)) return '💻';
            return '📁';
        }
        
        function truncate(str, len) {
            return str.length > len ? str.slice(0, len-3) + '...' : str;
        }
        
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        function addMessage(content, role, files = []) {
            const welcome = messagesEl.querySelector('.welcome');
            if (welcome) welcome.remove();
            
            let fileInfo = '';
            if (files.length > 0) {
                fileInfo = `<div style="font-size: 12px; opacity: 0.8; margin-top: 8px;">📎 ${files.map(f => f.name).join(', ')}</div>`;
            }
            
            const msg = document.createElement('div');
            msg.className = `message ${role}`;
            msg.innerHTML = `
                <div class="avatar">${role === 'assistant' ? '📋' : '👤'}</div>
                <div class="bubble">${escapeHtml(content)}${fileInfo}</div>
            `;
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function addTyping() {
            const msg = document.createElement('div');
            msg.className = 'message assistant';
            msg.id = 'typing';
            msg.innerHTML = `
                <div class="avatar">📋</div>
                <div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>
            `;
            messagesEl.appendChild(msg);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }
        
        function removeTyping() {
            const t = document.getElementById('typing');
            if (t) t.remove();
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text && pendingFiles.length === 0) return;
            
            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;
            
            const filesToSend = [...pendingFiles];
            pendingFiles = [];
            renderFilePreview();
            
            addMessage(text || 'Analyze these files', 'user', filesToSend);
            addTyping();
            
            try {
                let response;
                
                if (filesToSend.length > 0) {
                    // Use multimodal endpoint with files
                    const formData = new FormData();
                    formData.append('message', text || 'Analyze these files');
                    formData.append('sessionId', sessionId);
                    for (const file of filesToSend) {
                        formData.append('files', file);
                    }
                    
                    response = await fetch('/api/maven/chat-with-files', {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    // Text-only endpoint
                    response = await fetch('/api/maven/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, sessionId: sessionId })
                    });
                }
                
                const data = await response.json();
                removeTyping();
                addMessage(data.response || 'No response received', 'assistant');
            } catch (error) {
                console.error('Error:', error);
                removeTyping();
                addMessage('Connection error. Please try again.', 'assistant');
            }
            
            sendBtn.disabled = false;
            inputEl.focus();
        }
        
        inputEl.focus();
    </script>
</body>
</html>
